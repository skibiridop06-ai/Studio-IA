name: Gerar APK
on:
  push:
    branches: [main]
    paths-ignore: ['studio-ia.zip', 'build-error.txt']
  workflow_run:
    workflows: ['Extrair zip']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps 2>&1 | tee -a build.log
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log
      - name: Compilar APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee -a ../build.log
      - name: Salvar erro no repositório
        if: failure()
        run: |
          { grep -n -B5 -A40 "What went wrong" build.log; echo "----- FIM DO LOG -----"; tail -n 200 build.log; } > build-error.txt || tail -n 300 build.log > build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add build-error.txt
          git commit -m "Log do erro de build"
          git push
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Studio IA v0.1.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
