name: Extrair zip
on:
  push:
    paths: ['studio-ia.zip', '.github/workflows/extrair.yml']
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair
        run: |
          [ -f studio-ia.zip ] || exit 0
          unzip -o studio-ia.zip -d /tmp/x
          cp -r /tmp/x/studio-ia/. .
          git rm -q studio-ia.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrai o projeto do zip"
          git push
